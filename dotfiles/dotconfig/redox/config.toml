theme = "default"
background_dimming = 0.5 # 0.0 disables popup background dimming; 1.0 is fully dimmed
undo_tree_history_size = 5000
icons_enabled = true

[keybindings.normal]
command = ";"

[which_key]
enabled = true
delay_ms = 2000

[[bind]]
mode = "normal"
keys = "<leader>rc"
command = ":config reload"
desc = "Reload configuration file"

[[bind]]
mode = "normal"
keys = "<leader>tr"
command = ":rain"
desc = "Trigger rain"

[themes.default.ui]
#"status.mode_normal" = { fg="#67656f", bg="#333138" }
"status.mode_normal" = { fg="#222125", bg="#333138" }

